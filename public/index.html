<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Адресная книга</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/contacts.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="container masthead-content">
      <h1>Адресная книга</h1>
      <button type="button" class="add-button" id="add-contact">
        <span aria-hidden="true">+</span> Добавить контакт
      </button>
    </div>
  </header>

  <main class="container">
    <section class="filters" aria-label="Фильтры контактов">
      <div role="search">
        <label for="search">Поиск по имени или телефону</label>
        <input type="search" id="search" maxlength="100" placeholder="Например, Анна или 900111">
      </div>
      <nav class="alphabet" id="alphabet" aria-label="Алфавитный указатель">
        <button type="button" class="filter-button" data-letter="" aria-pressed="true">Все</button>
      </nav>
    </section>

    <p class="results-status" id="results-status" role="status">Загрузка контактов…</p>
    <p class="notice" id="empty-message" hidden></p>
    <div class="notice error-notice" id="load-error" hidden>
      <p id="load-error-message" role="alert"></p>
      <button type="button" class="secondary" id="retry">Повторить</button>
    </div>
    <p class="notice" id="change-message" role="status" hidden></p>
    <p class="notice error-notice" id="delete-error" role="alert" hidden></p>
    <section class="contact-groups" id="contact-groups" aria-label="Контакты" aria-busy="true"></section>

    <nav class="pagination" id="pagination" aria-label="Страницы контактов" hidden>
      <button type="button" class="secondary" id="previous-page" disabled>Назад</button>
      <span id="page-number"></span>
      <button type="button" class="secondary" id="next-page" disabled>Вперёд</button>
    </nav>

    <noscript><p class="notice">Включите JavaScript, чтобы работать с контактами.</p></noscript>
  </main>

  <dialog id="contact-dialog" aria-labelledby="dialog-title">
    <form id="contact-form" novalidate>
      <h2 id="dialog-title">Новый контакт</h2>
      <fieldset id="contact-fields" class="contact-fields" aria-label="Данные контакта">
        <div class="field field-wide">
          <label for="full-name">Имя <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="full-name" name="full_name" autocomplete="name" maxlength="100" required autofocus>
          <p class="field-error" id="full-name-error" role="alert" hidden></p>
        </div>
        <div class="field">
          <label for="phone">Телефон</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" maxlength="30" placeholder="+7 (900) 000-00-00">
          <p class="field-error" id="phone-error" role="alert" hidden></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" maxlength="100" placeholder="name@example.com">
          <p class="field-error" id="email-error" role="alert" hidden></p>
        </div>
        <div class="field field-wide">
          <label for="notes">Заметки</label>
          <textarea id="notes" name="notes" rows="3" maxlength="1000"></textarea>
          <p class="field-error" id="notes-error" role="alert" hidden></p>
        </div>
      </fieldset>
      <p class="field-error form-error" id="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancel-edit">Отмена</button>
        <button type="submit" id="save-contact">Добавить</button>
      </div>
    </form>
  </dialog>
</body>
</html>
